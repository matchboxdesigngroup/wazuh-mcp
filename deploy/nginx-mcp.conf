# Add this location block to the existing
#   server { server_name wazuh.matchbox.host; ... }
#
# nginx matches prefix locations longest-first, so this takes precedence over
# `location /` regardless of where in the block it appears. The Dashboard proxy
# is untouched.

location /mcp {
    # No URI part after the port, so the original /mcp path is passed through
    # unchanged and matches the server's own --path.
    proxy_pass http://127.0.0.1:8080;

    proxy_http_version 1.1;

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  https;
    proxy_set_header X-Forwarded-Host   $host;

    # Forwarded explicitly rather than relying on the default, since this
    # header carries the bearer token and must not be dropped.
    proxy_set_header Authorization      $http_authorization;

    # MCP streams responses over SSE. Buffering would hold events until the
    # response completed, and an empty Connection header keeps the upstream
    # connection alive rather than negotiating an upgrade.
    proxy_set_header Connection         "";
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;

    # Long-lived streams: the read timeout must outlast an idle session.
    proxy_connect_timeout 30s;
    proxy_send_timeout    3600s;
    proxy_read_timeout    3600s;
}
