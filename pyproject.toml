[project]
name = "wazuh-mcp"
version = "0.1.0"
description = "MCP server for querying a remote Wazuh manager and indexer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.1.1",
    "httpx>=0.28.1",
    "pydantic>=2.13",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
]

[project.scripts]
wazuh-mcp = "wazuh_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wazuh_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
